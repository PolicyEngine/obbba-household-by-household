<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			// The old slugs redirect to /us/obbba-households on the origin and on
			// policyengine.org. If an old-slug URL ever serves this bundle anyway
			// (a stale or misrouted response), move it under the base path before
			// SvelteKit starts: SvelteKit reloads any URL outside its base, which
			// would loop.
			(function () {
				var legacy = /^\/us\/obbba-household-(?:explorer|by-household)(\/.*)?$/;
				var match = location.pathname.match(legacy);
				if (match) {
					location.replace('/us/obbba-households' + (match[1] || '') + location.search + location.hash);
				}
			})();
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
		<style>
			:root {
				--pe-font-family-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			}
		</style>
		<link
		href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
		rel="stylesheet"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-2YHG89FY0N"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			gtag('config', 'G-2YHG89FY0N');
			setTimeout(function () {
				gtag('event', 'tool_engaged', {
					toolSlug: 'obbba-household-explorer',
					toolTitle: 'OBBBA household impact explorer'
				});
			}, 15000);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
