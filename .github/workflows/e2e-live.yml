name: Browser regression (live)

# Runs the Playwright suite (e2e/) against the live hosts:
#   - the Vercel origin, https://obbba-household-by-household.vercel.app
#   - policyengine.org, which proxies it at /us/obbba-households and 308s the
#     old slugs
#   - the GitHub Pages copy
# after every production deployment, daily (policyengine.org deploys from
# another repo and can break the proxy or redirects), and on demand. The
# origin route table is the same one CI runs against serve-policyengine.js,
# so this also catches the local helper drifting from Vercel.

on:
  deployment_status:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Browser regression (live hosts)
    # Vercel marks its deployments environment "Production" (and
    # production_environment false); skip previews and GitHub Pages.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for the origin to serve the triggering deployment
        # svelte.config.js names the build after VERCEL_GIT_COMMIT_SHA.
        if: github.event_name == 'deployment_status'
        env:
          SHA: ${{ github.event.deployment.sha }}
        run: |
          url="https://obbba-household-by-household.vercel.app/us/obbba-households/_app/version.json"
          for i in $(seq 1 40); do
            served=$(curl -fsS "$url?_=$i" | node -pe 'JSON.parse(require("fs").readFileSync(0)).version' || true)
            echo "attempt $i: serving ${served:-nothing}"
            [ "$served" = "$SHA" ] && exit 0
            sleep 15
          done
          echo "Production alias never served $SHA"; exit 1

      - name: Run the suite against the live hosts
        run: npx playwright test --project=origin-live --project=parent-live --project=pages-live

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: |
            playwright-report/
            test-results/
          retention-days: 14
